<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The full app icon, rings and dots included. At 180px the detail
         the favicon drops is legible again, and a home-screen shortcut
         should look like the app it sits beside. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Smart App Banner: offers the companion app to iOS Safari visitors.
         Keep the id in step with APP_STORE_ID in src/appStore.ts. -->
    <meta name="apple-itunes-app" content="app-id=6785231353" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400;1,8..60,700&display=swap"
    />
    <title>Monthly Rule</title>
    <!-- Link previews. Preview crawlers don't run JavaScript, so every page
         shares these site-wide values; per-page titles come from PageMeta
         and only search engines that render the page will see them. -->
    <meta property="og:site_name" content="Monthly Rule" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Monthly Rule" />
    <meta
      property="og:description"
      content="Six tactical asset allocation strategies, judged by the depth of the fall rather than the height of the return."
    />
    <meta property="og:image" content="https://monthlyrule.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Monthly Rule — Built to be held. VAA, DAA, PAA, HAA, BAA, LAA."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless, so no consent banner. Added
         by hand because DNS is grey-cloud and Cloudflare's auto-inject
         only works on proxied traffic. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "fb7fc090e0dd49a19ba6bcd00092c69b"}'></script>
  </body>
</html>
