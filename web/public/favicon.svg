<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Momentum Investment">
  <!--
    The app's mark, reduced to what survives a browser tab.

    The iOS icon carries two thin orbital rings, four mint dots and one
    amber dot around the arrow. At 1024px those read; at 16px the rings
    are under a tenth of a pixel and the dots are sub-pixel, so they
    resolve to grey haze over a black square. Only the arrow is legible
    at the size a favicon is actually seen, so only the arrow is here.

    The ground is the site's own ink token rather than a sample of the
    PNG: the two are indistinguishable at this size, and this way the tab
    and the page are the same black by construction. (Written out rather
    than named, because a CSS custom property's leading double hyphen is
    not legal inside an XML comment.)

    apple-touch-icon.png keeps the full icon, rings and all — at 180px
    there is room for it, and the home screen should match the app.
  -->
  <rect width="48" height="48" rx="10" fill="#0a0a0a"/>
  <path d="M36.6 11.4 23.9 38.3 21 26.9Z" fill="#ffffff"/>
  <path d="M36.6 11.4 21 26.9 9.7 24.1Z" fill="#c6ccd4"/>
</svg>
